# Runs on every push to main, on pull requests, and on demand - the admin
# panel's "Run now" button dispatches this same workflow through the GitHub API.
#
# Railway deploys main on push whether or not this passes. Making a deploy WAIT
# for it is a Railway setting ("Wait for CI" on each service), not something
# this file can do.
#
# The job names are read by the admin panel's CI page. Renaming one is fine;
# the page lists whatever jobs a run reports.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway. tests/test_sql.py drops and rebuilds its schema, and refuses
      # to run against anything that is not a local host.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: answergap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANSWERGAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/answergap_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      # BEFORE the tests, because it answers a different question and answers
      # it in a second: is every name in this package actually defined?
      #
      # On 2026-09-24 `live.build_from_response` used `count_questions` and
      # never imported it. Production answered every search with a 500 and the
      # suite stayed green, because that function is on the paid crawl path
      # and no test called it. This step would have failed the push with the
      # file and the line number.
      #
      # Annotated like the tests below, and for the same reason: a red run
      # nobody can read from a terminal is barely a red run.
      - name: Undefined names
        run: |
          set -o pipefail
          python -m pyflakes answergap api scripts 2>&1 | tee /tmp/pyflakes.txt || true
          if [ -s /tmp/pyflakes.txt ]; then
            while read -r line; do echo "::error::$line"; done < /tmp/pyflakes.txt
            exit 1
          fi

      # WHY THIS IS NOT JUST `pytest -q`.
      #
      # tests/test_sql.py only ever runs HERE. There is no Postgres on the
      # development machine and the fixture refuses a non-local host on
      # purpose, so every SQL test skips locally - which is exactly the gap
      # that let a SQL bug take Google sign-in down in production on
      # 2026-09-15.
      #
      # A red run whose reason can only be read by a human with repository
      # access is barely better than no run at all when the person fixing it
      # is working from a terminal. `::error::` lines become check-run
      # ANNOTATIONS, which are readable through the public API, so a failure
      # says what failed rather than "exit code 1".
      - name: Backend tests
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short 2>&1 | tee /tmp/pytest.txt
        continue-on-error: true
        id: pytest
      - name: Report failures as annotations
        if: steps.pytest.outcome == 'failure'
        run: |
          # The short summary block pytest prints last, one annotation per
          # failing test, plus the first assertion line of each traceback.
          sed -n '/^=* short test summary/,$p' /tmp/pytest.txt             | grep -E '^(FAILED|ERROR)'             | while read -r line; do echo "::error::$line"; done
          grep -E '^E   ' /tmp/pytest.txt | head -40             | while read -r line; do echo "::error::$line"; done
          exit 1

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
