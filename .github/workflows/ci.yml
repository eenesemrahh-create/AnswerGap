# Runs on every push to main, on pull requests, and on demand - the admin
# panel's "Run now" button dispatches this same workflow through the GitHub API.
#
# Railway deploys main on push whether or not this passes. Making a deploy WAIT
# for it is a Railway setting ("Wait for CI" on each service), not something
# this file can do.
#
# The job names are read by the admin panel's CI page. Renaming one is fine;
# the page lists whatever jobs a run reports.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway. tests/test_sql.py drops and rebuilds its schema, and refuses
      # to run against anything that is not a local host.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: answergap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANSWERGAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/answergap_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
